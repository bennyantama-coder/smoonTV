name: Build WidgeTV Padang APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
           packages: 'platform-tools'
      - name: Install SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync daily thoughts
        run: cp ../content/thoughts.json app/src/main/res/raw/thoughts.json
      - name: Build, lint and unit tests
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug lintDebug testDebugUnitTest
      - name: Verify APK and generate checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/WidgeTV-Padang-debug.apk
          cd ../dist
          sha256sum WidgeTV-Padang-debug.apk > SHA256SUMS.txt
      - name: Upload APK after checks pass
        uses: actions/upload-artifact@v4
        with:
          name: WidgeTV-Padang-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WidgeTV-build-reports
          path: |
            launcher/app/build/reports/
            launcher/app/build/test-results/
          if-no-files-found: ignore
